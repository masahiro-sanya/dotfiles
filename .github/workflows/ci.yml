name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON (settings / keybindings / codex hooks)
        run: |
          jq . claude/settings.json > /dev/null
          jq . claude/keybindings.json > /dev/null
          jq . codex/hooks.json > /dev/null

      - name: Forbid runtime fields in settings.json
        # キー一覧は git/strip-claude-runtime.sh が唯一の定義元（--check に委ねる）
        run: |
          bad="$(bash git/strip-claude-runtime.sh --check < claude/settings.json)"
          if [ -n "$bad" ]; then
            echo "runtime fields must not be committed: $bad" >&2
            exit 1
          fi

      - name: Bash syntax check
        run: |
          for f in claude/hooks/*.sh claude/hooks/tests/*.sh claude/scripts/*.sh claude/statusline.sh git/*.sh git/tests/*.sh setup.sh .githooks/pre-commit; do
            if [ -f "$f" ]; then
              bash -n "$f"
              echo "syntax OK: $f"
            fi
          done

      - name: shellcheck
        run: shellcheck -S warning claude/hooks/*.sh claude/hooks/tests/*.sh claude/scripts/*.sh claude/statusline.sh git/*.sh git/tests/*.sh .githooks/pre-commit

      - name: Hooks regression tests
        run: bash claude/hooks/tests/run-tests.sh

      - name: strip-claude-runtime filter tests
        run: bash git/tests/strip-claude-runtime.test.sh
